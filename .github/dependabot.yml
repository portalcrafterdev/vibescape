# Dependency updates. Grouped so a week of patch bumps arrives as one PR rather
# than twenty, which is the difference between reviewing them and ignoring them.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "backend"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      mobile-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "mobile"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
