[project]
name = "vibescape-backend"
version = "0.1.0"
description = "Vibescape API — FastAPI backend for the Vibescape mobile app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The SQLAlchemy engine and Redis client are module-level singletons, so their
# connections bind to whichever loop created them. A per-test loop would leave them
# pointing at a closed one ("attached to a different loop"), so share a single loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 = assert: fine in tests. Handled per-file below.

[tool.ruff.lint.per-file-ignores]
# S101 assert, S105/S106 literal passwords, S110 try/except/pass in cleanup —
# all expected in a test suite that exercises authentication.
"tests/*" = ["S101", "S105", "S106", "S110"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
